<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Forensics</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ff88;
            --neon2: #00e5ff;
            --bg: #030a06;
            --panel: #060f09;
            --border: #0d2b18;
            --text: #c8f5dc;
            --muted: #3a6e52;
            --danger: #ff3a3a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
            padding: 40px 16px;
        }

        /* Scanline overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,255,136,0.013) 2px,
                rgba(0,255,136,0.013) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        /* Grid background */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,136,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.035) 1px, transparent 1px);
            background-size: 44px 44px;
            animation: gridMove 18s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(44px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            animation: fadeUp 0.7s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── HEADER ── */
        .header {
            border: 1px solid var(--neon);
            border-bottom: none;
            padding: 28px 32px 24px;
            background: linear-gradient(160deg, rgba(0,255,136,0.07) 0%, transparent 60%);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--neon) 50%, transparent 100%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 48px; height: 48px;
            border: 2px solid var(--neon);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            background: rgba(0,255,136,0.08);
            flex-shrink: 0;
            animation: logoPulse 2.4s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.5); }
            50%      { box-shadow: 0 0 0 10px rgba(0,255,136,0); }
        }

        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--neon);
            text-transform: uppercase;
            text-shadow: 0 0 24px rgba(0,255,136,0.6), 0 0 48px rgba(0,255,136,0.2);
        }

        .subtitle {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 4px;
            margin-top: 3px;
        }

        /* ── STATUS BAR ── */
        .status-bar {
            background: rgba(0,255,136,0.04);
            border-left: 1px solid var(--neon);
            border-right: 1px solid var(--neon);
            padding: 9px 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--neon);
            box-shadow: 0 0 6px var(--neon);
            animation: blink 1.4s step-end infinite;
        }

        @keyframes blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.1; }
        }

        /* ── PANEL BODY ── */
        .panel-body {
            border: 1px solid var(--neon);
            border-top: none;
            padding: 28px 32px 34px;
            background: var(--panel);
        }

        /* Section label */
        .sec-label {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sec-label::after {
            content: '';
            flex: 1; height: 1px;
            background: var(--border);
        }

        /* ── UPLOAD ZONE ── */
        .upload-zone {
            border: 1px dashed #1a4a2e;
            border-radius: 6px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,255,136,0.02);
            transition: border-color 0.25s, background 0.25s;
            margin-bottom: 24px;
        }
        .upload-zone:hover {
            border-color: var(--neon);
            background: rgba(0,255,136,0.05);
        }

        .file-wrap { position: relative; }
        .file-wrap input[type="file"] {
            position: absolute; inset: 0;
            opacity: 0; cursor: pointer; width: 100%;
        }
        .choose-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 16px;
            border: 1px solid #1a4a2e;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--text);
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.2s;
        }
        .choose-btn:hover { border-color: var(--neon); }

        #fileNameDisplay {
            flex: 1;
            font-size: 11px;
            color: var(--neon2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .scan-btn {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 10px 22px;
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .scan-btn:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 22px rgba(0,255,136,0.45);
        }

        /* ── DIVIDER ── */
        .divider {
            display: flex; align-items: center; gap: 14px;
            margin: 22px 0;
            font-size: 10px; color: var(--muted); letter-spacing: 4px;
        }
        .divider::before,.divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        /* ── WAVEFORM ── */
        #waveformCanvas {
            width: 100%;
            height: 64px;
            display: none;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: rgba(0,0,0,0.5);
        }

        /* ── RECORD BUTTON ── */
        .record-row {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        #recordBtn {
            position: relative;
            background: transparent;
            border: 1px solid var(--neon2);
            color: var(--neon2);
            padding: 13px 26px;
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            overflow: hidden;
        }
        #recordBtn:hover {
            background: var(--neon2);
            color: #000;
            box-shadow: 0 0 22px rgba(0,229,255,0.4);
        }
        #recordBtn.recording {
            border-color: var(--danger);
            color: var(--danger);
            animation: recPulse 1s ease-in-out infinite;
        }
        #recordBtn.recording:hover {
            background: var(--danger);
            color: #fff;
        }
        @keyframes recPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,58,58,0.5); }
            50%      { box-shadow: 0 0 0 10px rgba(255,58,58,0); }
        }

        #recordStatus {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.5px;
            line-height: 1.7;
        }

        /* ── RESULT BOX ── */
        .result-box {
            display: none;
            margin-top: 30px;
            border: 1px solid var(--neon);
            border-radius: 6px;
            overflow: hidden;
            animation: revealResult 0.5s ease forwards;
        }

        @keyframes revealResult {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-hdr {
            background: rgba(0,255,136,0.07);
            padding: 11px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .result-hdr-label {
            font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase;
        }
        .result-id {
            font-size: 10px; color: var(--muted);
        }

        .result-grid {
            padding: 22px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .r-card {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px 16px;
            transition: border-color 0.2s;
        }
        .r-card:hover { border-color: #1a4a2e; }

        .r-card-label {
            font-size: 9px; letter-spacing: 3px;
            color: var(--muted); text-transform: uppercase; margin-bottom: 9px;
        }

        .r-card-val {
            font-family: 'Orbitron', monospace;
            font-size: 15px; font-weight: 700;
            color: var(--neon);
        }
        .r-card-val.human  { color: var(--neon);  text-shadow: 0 0 12px rgba(0,255,136,0.5); }
        .r-card-val.machine{ color: var(--danger); text-shadow: 0 0 12px rgba(255,58,58,0.5); }

        #sentText { font-size: 20px; }

        /* Confidence bar */
        .conf-card {
            grid-column: 1 / -1;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px 16px;
        }
        .conf-track {
            height: 6px;
            background: rgba(0,255,136,0.07);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        .conf-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon2), var(--neon));
            border-radius: 3px;
            width: 0;
            transition: width 1.1s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 0 8px rgba(0,255,136,0.5);
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo-row">
            <div class="logo-icon">🎙️</div>
            <div>
                <h1>Voice AI Forensics</h1>
                <div class="subtitle">Audio Intelligence System v2.0</div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div class="dot"></div>
        <span>SYSTEM ONLINE &nbsp;|&nbsp; AWAITING INPUT</span>
    </div>

    <div class="panel-body">

        <div class="sec-label">Input Source — File</div>
        <div class="upload-zone">
            <div class="file-wrap">
                <input type="file" id="audioInput" accept="audio/*" onchange="updateFileName(this)">
                <div class="choose-btn">📂 Choose File</div>
            </div>
            <span id="fileNameDisplay">No file selected</span>
            <button class="scan-btn" onclick="uploadAudio()">▶ SCAN</button>
        </div>

        <div class="divider">OR</div>

        <div class="sec-label">Input Source — Live Mic</div>
        <canvas id="waveformCanvas" height="64"></canvas>

        <div class="record-row">
            <button id="recordBtn" onclick="toggleRecording()">⬤ &nbsp;Start Recording</button>
            <p id="recordStatus">Ready to capture voice input</p>
        </div>

        <div id="resultBox" class="result-box">
            <div class="result-hdr">
                <span class="result-hdr-label">⚡ Analysis Report</span>
                <span class="result-id" id="resultId">ID: —</span>
            </div>
            <div class="result-grid">
                <div class="r-card">
                    <div class="r-card-label">Classification</div>
                    <div class="r-card-val" id="predText">—</div>
                </div>
                <div class="r-card">
                    <div class="r-card-label">Emotion</div>
                    <div class="r-card-val" id="sentText">—</div>
                </div>
                <div class="conf-card">
                    <div class="r-card-label">Certainty — <span id="confText">0%</span></div>
                    <div class="conf-track"><div class="conf-fill" id="confBar"></div></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
let mediaRecorder = null, audioChunks = [], isRecording = false;
let animFrame = null, audioCtxLive = null;

function updateFileName(input) {
    document.getElementById("fileNameDisplay").textContent =
        input.files[0] ? input.files[0].name : "No file selected";
}

async function blobToWav(blob) {
    const ab = await blob.arrayBuffer();
    const actx = new AudioContext({ sampleRate: 16000 });
    const decoded = await actx.decodeAudioData(ab);
    await actx.close();
    const samples = decoded.getChannelData(0);
    const len = samples.length;
    const buf = new ArrayBuffer(44 + len * 2);
    const v = new DataView(buf);
    const ws = (o, s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    ws(0,'RIFF'); v.setUint32(4,36+len*2,true); ws(8,'WAVE'); ws(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,16000,true); v.setUint32(28,32000,true);
    v.setUint16(32,2,true); v.setUint16(34,16,true);
    ws(36,'data'); v.setUint32(40,len*2,true);
    let off=44;
    for (let i=0;i<len;i++) {
        const s=Math.max(-1,Math.min(1,samples[i]));
        v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true); off+=2;
    }
    return new Blob([buf],{type:'audio/wav'});
}

function getSupportedMime() {
    for (const t of ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg','audio/mp4'])
        if (MediaRecorder.isTypeSupported(t)) return t;
    return '';
}

function startWaveform(stream) {
    const canvas = document.getElementById('waveformCanvas');
    canvas.style.display = 'block';
    canvas.width = canvas.offsetWidth;
    const ctx = canvas.getContext('2d');
    audioCtxLive = new AudioContext();
    const src = audioCtxLive.createMediaStreamSource(stream);
    const analyser = audioCtxLive.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    function draw() {
        animFrame = requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(data);
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='rgba(0,0,0,0.5)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle='#00ff88'; ctx.lineWidth=1.8;
        ctx.shadowBlur=10; ctx.shadowColor='#00ff88';
        ctx.beginPath();
        const sw = canvas.width / data.length;
        data.forEach((d,i) => {
            const y = (d/128)*(canvas.height/2);
            i===0 ? ctx.moveTo(0,y) : ctx.lineTo(i*sw,y);
        });
        ctx.stroke();
    }
    draw();
}

function stopWaveform() {
    if (animFrame) cancelAnimationFrame(animFrame);
    if (audioCtxLive) { audioCtxLive.close(); audioCtxLive = null; }
    const c = document.getElementById('waveformCanvas');
    c.getContext('2d').clearRect(0,0,c.width,c.height);
    c.style.display='none';
}

async function toggleRecording() {
    const btn = document.getElementById("recordBtn");
    const status = document.getElementById("recordStatus");

    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            const mime = getSupportedMime();
            mediaRecorder = new MediaRecorder(stream, mime ? {mimeType:mime} : {});
            audioChunks = []; isRecording = true;
            startWaveform(stream);

            mediaRecorder.ondataavailable = e => { if(e.data?.size>0) audioChunks.push(e.data); };
            mediaRecorder.onerror = e => {
                status.innerText="❌ Error: "+e.error.name;
                isRecording=false; btn.innerHTML="⬤ &nbsp;Start Recording";
                btn.classList.remove('recording'); stopWaveform();
            };
            mediaRecorder.onstop = async () => {
                stopWaveform();
                status.innerText="⏳ Analyzing...";
                if(!audioChunks.length){status.innerText="❌ No audio.";return;}
                const raw=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
                if(raw.size<500){status.innerText="❌ Too short.";return;}
                try { sendToServer(await blobToWav(raw),"audio.wav"); }
                catch(e){status.innerText="❌ "+e.message;}
            };
            mediaRecorder.start(100);
            btn.innerHTML="■ &nbsp;Stop & Analyze";
            btn.classList.add('recording');
            status.innerText="🔴 Recording...";
        } catch(err) {
            status.innerText = err.name==='NotAllowedError' ? "❌ Mic permission denied."
                             : err.name==='NotFoundError'   ? "❌ No microphone found."
                             : "❌ "+err.message;
        }
    } else {
        if(mediaRecorder?.state!=="inactive"){
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(t=>t.stop());
        }
        isRecording=false;
        btn.innerHTML="⬤ &nbsp;Start Recording";
        btn.classList.remove('recording');
    }
}

function uploadAudio() {
    const file = document.getElementById("audioInput").files[0];
    if(!file) return alert("Select a file first.");
    document.getElementById("recordStatus").innerText="⏳ Analyzing...";
    sendToServer(file, file.name);
}

async function sendToServer(blob, filename) {
    const fd = new FormData();
    fd.append("file", blob, filename);
    try {
        const res = await fetch("/predict",{method:"POST",body:fd});
        const data = await res.json();
        if(!res.ok) throw new Error(data.error||"Server error");

        document.getElementById("recordStatus").innerText="✅ Analysis complete.";
        document.getElementById("resultBox").style.display="block";

        const pred = document.getElementById("predText");
        pred.innerText = data.prediction;
        pred.className = "r-card-val "+(data.prediction.includes("Human")?"human":"machine");

        document.getElementById("sentText").innerText = data.sentiment;
        document.getElementById("confText").innerText = data.confidence;
        setTimeout(()=>{
            document.getElementById("confBar").style.width = parseFloat(data.confidence)+"%";
        },120);
        document.getElementById("resultId").innerText =
            "ID: "+Math.random().toString(36).substr(2,8).toUpperCase();
    } catch(err) {
        document.getElementById("recordStatus").innerText="❌ "+err.message;
    }
}
</script>
</body>
</html>
